# Continuous Integration Configuration for CrystalCog Testing Suite
# This file defines the CI/CD pipeline for comprehensive testing

name: CrystalCog Comprehensive Testing Suite

on:
  push:
    branches: [ main, develop, 'copilot/*' ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run nightly tests
    - cron: '0 2 * * *'

env:
  CRYSTAL_VERSION: '1.10.1'
  
jobs:
  # Unit Tests Job
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [cogutil, atomspace, pln, cogserver, pattern_matching, nlp]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Install Crystal
      run: |
        curl -fsSL https://crystal-lang.org/install.sh | sudo bash
        
    - name: Install dependencies
      run: |
        shards install --skip-postinstall
        
    - name: Run unit tests for ${{ matrix.component }}
      run: |
        ./tests/comprehensive-test-suite.sh --unit --component ${{ matrix.component }}
        
    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: unit-test-results-${{ matrix.component }}
        path: tests/reports/

  # Integration Tests Job  
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Install Crystal
      run: |
        curl -fsSL https://crystal-lang.org/install.sh | sudo bash
        
    - name: Install Guile (for Agent-Zero tests)
      run: |
        sudo apt-get update
        sudo apt-get install -y guile-3.0 guile-3.0-dev
        
    - name: Install dependencies
      run: |
        shards install --skip-postinstall
        
    - name: Run integration tests
      run: |
        ./tests/comprehensive-test-suite.sh --integration
        
    - name: Run Agent-Zero tests
      run: |
        ./tests/comprehensive-test-suite.sh --agent-zero
        
    - name: Upload integration test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: integration-test-results
        path: tests/reports/integration/

  # Performance Tests Job
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Install Crystal
      run: |
        curl -fsSL https://crystal-lang.org/install.sh | sudo bash
        
    - name: Install dependencies
      run: |
        shards install --skip-postinstall
        
    - name: Run performance benchmarks
      run: |
        ./tests/comprehensive-test-suite.sh --performance
        
    - name: Upload performance results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: performance-test-results
        path: tests/reports/performance/

  # Functional Tests Job
  functional-tests:
    name: Functional Tests
    runs-on: ubuntu-latest
    needs: integration-tests
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Install Crystal
      run: |
        curl -fsSL https://crystal-lang.org/install.sh | sudo bash
        
    - name: Install dependencies
      run: |
        shards install --skip-postinstall
        
    - name: Run functional tests
      run: |
        ./tests/comprehensive-test-suite.sh --functional
        
    - name: Upload functional test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: functional-test-results
        path: tests/reports/

  # Coverage Analysis Job
  coverage-analysis:
    name: Coverage Analysis
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Install Crystal
      run: |
        curl -fsSL https://crystal-lang.org/install.sh | sudo bash
        
    - name: Install dependencies
      run: |
        shards install --skip-postinstall
        
    - name: Generate coverage report
      run: |
        ./tests/comprehensive-test-suite.sh --coverage
        
    - name: Upload coverage reports
      uses: actions/upload-artifact@v3
      with:
        name: coverage-reports
        path: tests/reports/coverage/

  # Comprehensive Test Report Job
  test-report:
    name: Generate Test Report
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, performance-tests, functional-tests, coverage-analysis]
    if: always()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Download all test artifacts
      uses: actions/download-artifact@v3
      with:
        path: test-artifacts/
        
    - name: Install Crystal
      run: |
        curl -fsSL https://crystal-lang.org/install.sh | sudo bash
        
    - name: Install dependencies
      run: |
        shards install --skip-postinstall
        
    - name: Generate comprehensive report
      run: |
        ./tests/comprehensive-test-suite.sh --reports
        
    - name: Upload comprehensive report
      uses: actions/upload-artifact@v3
      with:
        name: comprehensive-test-report
        path: tests/reports/
        
    - name: Comment PR with test results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          
          // Find the latest test summary report
          const reportsDir = 'tests/reports';
          const files = fs.readdirSync(reportsDir);
          const summaryFile = files.find(f => f.startsWith('test-summary-'));
          
          if (summaryFile) {
            const reportPath = path.join(reportsDir, summaryFile);
            const reportContent = fs.readFileSync(reportPath, 'utf8');
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🧪 Comprehensive Test Suite Results\n\n\`\`\`\n${reportContent}\n\`\`\``
            });
          }

  # Docker Build Test (Optional)
  docker-build-test:
    name: Docker Build Test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Build Docker image
      run: |
        if [ -f "Dockerfile" ]; then
          docker build -t crystalcog:test .
          docker run --rm crystalcog:test ./tests/comprehensive-test-suite.sh --unit
        else
          echo "No Dockerfile found, skipping Docker build test"
        fi

  # Nightly Regression Tests
  nightly-regression:
    name: Nightly Regression Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Install Crystal
      run: |
        curl -fsSL https://crystal-lang.org/install.sh | sudo bash
        
    - name: Install Guile
      run: |
        sudo apt-get update
        sudo apt-get install -y guile-3.0 guile-3.0-dev
        
    - name: Install dependencies
      run: |
        shards install --skip-postinstall
        
    - name: Run full test suite
      run: |
        ./tests/comprehensive-test-suite.sh --all
        
    - name: Upload nightly test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: nightly-test-results
        path: tests/reports/
        
    - name: Send notification on failure
      if: failure()
      uses: actions/github-script@v6
      with:
        script: |
          github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: `Nightly regression tests failed - ${new Date().toISOString().split('T')[0]}`,
            body: `The nightly regression test suite has failed. Please check the test results and fix any issues.\n\nRun ID: ${context.runId}\nWorkflow: ${context.workflow}`
          });

# Workflow notifications
notifications:
  slack:
    if: always()
    webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
    message: |
      CrystalCog Test Suite Results:
      Status: ${{ job.status }}
      Branch: ${{ github.ref }}
      Commit: ${{ github.sha }}
      Author: ${{ github.actor }}